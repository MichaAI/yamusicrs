[workspace]
resolver = "3"
members = ["crates/core", "crates/tui"]
default-members = ["crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
yamusic-core = { path = "crates/core" }

# runtime / util
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures-util = "0.3"
libc = "0.2"
color-eyre = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rand = "0.9"
clap = { version = "4", features = ["derive"] }

# api / crypto
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form", "query", "http2"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
aes = "0.9"
ctr = "0.10"
hex = "0.4"

# audio
symphonia = { version = "0.6", features = ["flac", "isomp4", "aac", "mp3"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }
rtrb = "0.4"
lofty = "0.25"

# ui
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1"
pollster = "1"
wgpu = "29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false }
unicode-width = "0.2"
textwrap = "0.16"

# desktop integration
# MPRIS и расширение шелла — свои интерфейсы прямо на zbus.
zbus = "6"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Для разработки: инкрементально и параллельно — правка пересобирает за секунды, а не минуты.
[profile.release]
incremental = true
codegen-units = 16
lto = false

# Для пакета (`nix build`): медленнее собирается, бинарь меньше и быстрее.
[profile.dist]
inherits = "release"
incremental = false
codegen-units = 1
lto = "thin"
