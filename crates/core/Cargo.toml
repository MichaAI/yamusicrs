rand.workspace = true

reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
aes.workspace = true
ctr.workspace = true
hex.workspace = true

symphonia.workspace = true
pipewire = { workspace = true, optional = true }
