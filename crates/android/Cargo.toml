[package]
name = "yamusic-android"
description = "Мост ядра yamusicrs в Android-приложение: UniFFI-объект Core, вывод звука через AAudio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "yamusic_android"
crate-type = ["cdylib", "lib"]

[dependencies]
yamusic-core.workspace = true
uniffi = "0.32"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
color-eyre.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
android_log-sys = "0.3"
